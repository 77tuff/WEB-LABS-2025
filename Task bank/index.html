      <h2>COMMENT SECTION</h2>
      <!-- This form allows a user to post a comment-->
      <form action="">
      <!-- The user name of the commentor -->
        <label for="name">Name:</label>
        <input type="text" name="display_name" id="name" />
        <!-- The text of the comment -->
        <label for="comment-text">Your comment:</label>
        <textarea name="user_comment" id="comment-text"></textarea>
    <!-- Button that will submit the form -->
